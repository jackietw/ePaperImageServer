<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Paper Image Management</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/admin.css?v=4">
    <style>
        /* Mobile layout fixes to completely bypass aggressive browser caching */
        @media (max-width: 600px) {
            .admin-header {
                padding: 0 35px !important;
                position: relative !important;
            }

            .admin-header h1 {
                font-size: 1.35rem !important;
                padding: 0 35px !important;
                box-sizing: border-box !important;
                line-height: 1.25 !important;
            }

            .hamburger-menu {
                display: flex !important;
                left: 5px !important;
                top: 6px !important;
            }

            .main-nav {
                left: 5px !important;
            }

            footer {
                position: relative !important;
                margin-top: 30px !important;
                padding: 10px 0 !important;
                background: transparent !important;
            }
        }
    </style>
</head>

<body>
    <header class="admin-header" style="position: relative;">
        <div class="hamburger-menu" id="mobile-menu-btn">
            <span></span>
            <span></span>
            <span></span>
        </div>
        <h1>E-Paper Image Management</h1>
        <p>Browse, preview, and delete uploaded images</p>
        <nav class="main-nav">
            <a href="/" class="nav-btn">Generator & Editor</a>
            <a href="queue.html" class="nav-btn">Queue</a>
            <a href="generated_admin.html" class="nav-btn">Generated Library</a>
            <a href="admin.html" class="nav-btn active">Editor Image</a>
        </nav>
        <div id="latest-status-container" class="latest-status-container">
            <!-- Status will be generated dynamically by JS -->
        </div>
    </header>

    <main class="gallery-container">
        <!-- Image thumbnails will be generated dynamically by JS -->
        <div id="gallery-grid" class="gallery-grid">
            <div class="loading-text">Loading...</div>
        </div>
    </main>

    <!-- Lightbox preview window -->
    <div id="lightbox" class="lightbox">
        <div class="lightbox-content">
            <span class="close-btn" id="lightbox-close">&times;</span>
            <img id="lightbox-img" src="" alt="Preview">
        </div>
    </div>

    <!-- Custom confirm delete dialog -->
    <div id="confirm-modal" class="confirm-modal">
        <div class="confirm-box">
            <h3>Confirm Delete</h3>
            <p>Are you sure you want to delete this image? This action cannot be undone.</p>
            <div class="confirm-actions">
                <button id="cancel-delete" class="btn btn-secondary">Cancel</button>
                <button id="confirm-delete" class="btn btn-danger">Confirm Delete</button>
            </div>
        </div>
    </div>
    <!-- footer -->
    <footer>
        <p>@2026 E-Paper Upload Website by Jackie | Version 1.2</p>
    </footer>
    <script src="assets/js/admin.js?v=2"></script>
</body>

</html>
