<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Paper Image Tools</title>
    <link rel="stylesheet" href="assets/css/style.css?v=5">
    <!-- Cropper.js CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">
    <style>
        /* Mobile layout fixes to completely bypass aggressive browser caching */
        @media (max-width: 600px) {
            header {
                padding: 0 35px !important;
                position: relative !important;
            }

            header h1 {
                font-size: 1.35rem !important;
                padding: 0 35px !important;
                box-sizing: border-box !important;
                line-height: 1.25 !important;
            }

            .hamburger-menu {
                display: flex !important;
                left: 5px !important;
                top: 6px !important;
            }

            .main-nav {
                left: 5px !important;
            }

            footer {
                position: relative !important;
                margin-top: 30px !important;
                padding: 10px 0 !important;
                background: transparent !important;
            }
        }
    </style>
</head>

<body>
    <div class="glass-container">
        <header style="position: relative;">
            <div class="hamburger-menu" id="mobile-menu-btn">
                <span></span>
                <span></span>
                <span></span>
            </div>
            <h1>E-Paper Image Tools</h1>
            <p>6-Color Dithering & Resizing</p>
            <nav class="main-nav">
                <a href="#" class="nav-btn active" id="upload-tab-btn">Upload Image</a>
                <a href="#" class="nav-btn" id="ai-tab-btn">AI Art Generator</a>
                <a href="queue.html" class="nav-btn">Queue</a>
                <a href="generated_admin.html" class="nav-btn">Generated Library</a>
                <a href="admin.html" class="nav-btn">Editor Image</a>
            </nav>
        </header>

        <main>
            <div class="upload-section" id="upload-section">
                <input type="file" id="image-upload" accept="image/*,.heic" hidden>
                <label for="image-upload" class="upload-label">
                    <div class="upload-icon">📁</div>
                    <span id="upload-text">Upload Image</span>
                </label>
            </div>

            <!-- AI Art Generator Section -->
            <div class="ai-section hidden" id="ai-section">
                <div class="workspace">
                    <div class="controls" style="width: 100%; max-width: 100%;">
                        <!-- AI Mode Selector -->
                        <div class="ai-modes-tabs">
                            <button class="ai-mode-btn active" data-mode="text">Text to Art</button>
                            <button class="ai-mode-btn" data-mode="scribble">Scribble to Art</button>
                            <button class="ai-mode-btn" data-mode="img2img">Image to Image (Style & Edges)</button>
                        </div>

                        <!-- Engine Source Configuration -->
                        <div class="ai-settings-grid" style="grid-template-columns: 1fr; margin-bottom: 15px;">
                            <div class="control-group">
                                <label>Generation Engine</label>
                                <select id="ai-engine" class="styled-select">
                                    <option value="cloud">Cloud API (Hugging Face / Gemini)</option>
                                    <option value="local">Local Server (CPU)</option>
                                    <option value="filter">Fast Filter (Local OpenCV / AnimeGAN)</option>
                                </select>
                            </div>
                        </div>

                        <!-- Cloud API Settings (Visible only when cloud is active) -->
                        <div id="ai-cloud-config-group">
                            <div class="ai-settings-grid"
                                style="grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); margin-bottom: 15px;">
                                <div class="control-group">
                                    <label for="ai-cloud-model">Cloud Model</label>
                                    <select id="ai-cloud-model" class="styled-select">
                                        <option value="black-forest-labs/FLUX.1-schnell" selected>(推薦) FLUX.1-schnell - 目前免費 API 最穩定/極速</option>
                                        <option value="stabilityai/stable-diffusion-xl-base-1.0">Stable Diffusion XL 1.0 - 官方基礎大模型</option>
                                        <option value="gemini-3.1-flash-image">Google Gemini 3.1 Flash Image (Nano Banana 2)</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <!-- Local CPU Settings (Visible only when local is active) -->
                        <div id="ai-local-config-group" class="hidden">
                            <div class="ai-settings-grid" style="grid-template-columns: 1fr; margin-bottom: 15px;">
                                <div class="control-group">
                                    <label for="ai-local-model">Local CPU Model (Anime & Ghibli)</label>
                                    <select id="ai-local-model" class="styled-select">
                                        <option value="Lykon/dreamshaper-8" selected>DreamShaper 8 (SD 1.5 綜合 - 快速)
                                        </option>
                                        <option value="stablediffusionapi/disney-pixar-cartoon">Disney Pixar Cartoon (SD 1.5 似顏繪/3D卡通 - 快速)</option>
                                        <option value="SG161222/Realistic_Vision_V5.1_noVAE">Realistic Vision V5.1 (SD
                                            1.5 頂級寫實 - 快速)</option>
                                        <option value="prompthero/openjourney">OpenJourney (SD 1.5 藝術風格 - 快速)</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <!-- Removed Filter Settings -->

                        <!-- Easy Mode Style Preset -->
                        <div class="control-group" id="ai-style-preset-group" style="margin-top: 15px;">
                            <label for="ai-style-preset" style="color: var(--primary-color); font-weight: bold;">✨ Art
                                Style (Easy Mode) 一鍵畫風懶人包</label>
                            <select id="ai-style-preset" class="styled-select"
                                style="border-color: var(--primary-color);">
                                <option value="none" selected>None (手動自由設定)</option>

                                <optgroup label="卡通漫畫 (Cartoon & Comic)">
                                    <option value="cartoon">美式卡通 (Cartoon)</option>
                                    <option value="comic">美漫風格 (Comic / Marvel Style)</option>
                                    <option value="caricature">誇張似顏繪 (Caricature)</option>
                                </optgroup>
                                <optgroup label="藝術畫派 (Fine Arts)">
                                    <option value="impressionism">印象派 (Impressionism - 莫內/梵谷風格)</option>
                                    <option value="realism">寫實派 (Realism - 古典油畫細節)</option>
                                    <option value="fauvism">野獸派 (Fauvism - 強烈色彩對比)</option>
                                    <option value="abstract">抽象派 (Abstract - 幾何與色彩解構)</option>
                                </optgroup>
                            </select>
                            <small style="color: #64748b; font-size: 0.8rem; margin-top: 4px; display: block;">
                                選擇風格後，系統會在「送出時」自動加上專業咒語，不會覆蓋您目前輸入的文字。
                            </small>
                        </div>

                        <!-- Prompt Input -->
                        <div class="control-group" id="ai-prompt-group">
                            <label for="ai-prompt" style="margin-bottom: 5px; display: block;">Positive Prompt</label>
                            <textarea id="ai-prompt" class="styled-textarea" autocomplete="off" data-lpignore="true"
                                data-1p-ignore
                                placeholder="Describe the art you want to generate... (e.g., A fantasy forest with glowing mushrooms, oil painting)"
                                rows="3"></textarea>
                        </div>

                        <div class="control-group" id="ai-neg-prompt-group">
                            <label for="ai-neg-prompt">Negative Prompt (Optional)</label>
                            <textarea id="ai-neg-prompt" class="styled-textarea" autocomplete="off" data-lpignore="true"
                                data-1p-ignore
                                placeholder="What to avoid in the image... (e.g., blurry, ugly, low quality)"
                                rows="2"></textarea>
                        </div>

                        <!-- Doodle Canvas (only visible in scribble mode) -->
                        <div id="ai-doodle-container" class="control-group hidden">
                            <label>Draw Your Doodle / Scribble (White canvas, black brush)</label>
                            <div class="doodle-canvas-wrapper">
                                <canvas id="doodle-canvas" width="512" height="512"></canvas>
                                <div class="doodle-toolbar">
                                    <div class="brush-size-group">
                                        <label for="brush-size">Brush Size: <span id="brush-size-val">8</span>px</label>
                                        <input type="range" id="brush-size" min="2" max="30" value="8"
                                            style="width: 120px;">
                                    </div>
                                    <button type="button" id="doodle-clear-btn" class="icon-btn danger-btn"
                                        style="padding: 6px 12px; font-size: 0.8rem; flex: none;">Clear Canvas</button>
                                </div>
                            </div>
                        </div>

                        <!-- Reference Image Input (only visible in img2img mode) -->
                        <div id="ai-ref-container" class="control-group hidden">
                            <label for="ai-ref-upload" class="upload-label"
                                style="border: 1px dashed var(--glass-border); padding: 20px; border-radius: 8px; cursor: pointer;">
                                <div class="upload-icon" style="font-size: 1.5rem;">🖼️</div>
                                <span id="ai-ref-text">Choose Reference Image</span>
                            </label>
                            <input type="file" id="ai-ref-upload" accept="image/*" hidden>
                            <div id="ai-ref-preview-container" class="hidden"
                                style="margin-top: 10px; text-align: center;">
                                <img id="ai-ref-preview" src="" alt="Reference Preview"
                                    style="max-height: 200px; border-radius: 8px; border: 1px solid var(--glass-border);">
                            </div>
                        </div>

                        <!-- Generation settings -->
                        <div class="ai-settings-grid">
                            <div class="control-group hidden" id="ai-edge-algorithm-group" style="grid-column: 1 / -1;">
                                <label for="ai-edge-algorithm">Image Generation Mode</label>
                                <select id="ai-edge-algorithm" class="styled-select">
                                    <option value="img2img" selected>Color & Style Transfer (標準圖生圖)</option>
                                    <option value="lineart">LineArt (動漫線稿控制)</option>
                                    <option value="hed">SoftEdge (柔和邊緣控制)</option>
                                    <option value="canny">Canny (硬邊緣控制)</option>
                                </select>
                            </div>
                            <div class="control-group" id="ai-steps-group">
                                <label for="ai-steps">Steps: <span id="ai-steps-val">30</span></label>
                                <input type="range" id="ai-steps" min="1" max="50" value="30">
                            </div>
                            <div class="control-group hidden" id="ai-strength-group">
                                <label for="ai-strength">Image Influence: <span id="ai-strength-val">0.75</span></label>
                                <input type="range" id="ai-strength" min="0.05" max="0.95" step="0.05" value="0.75">
                            </div>
                            <div class="control-group">
                                <label for="ai-seed">Seed (-1 for Random)</label>
                                <input type="number" id="ai-seed" value="-1" min="-1" class="styled-input">
                            </div>
                        </div>

                        <button id="ai-generate-btn" class="primary-btn" style="margin-top: 15px; width: 100%;">Generate
                            Art</button>
                    </div>
                </div>
            </div>

            <!-- Loading Spinner Overlay -->
            <div id="ai-loading-overlay" class="hidden"
                style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;">
                <div class="spinner"
                    style="width: 50px; height: 50px; border: 5px solid rgba(59, 130, 246, 0.2); border-top-color: var(--primary-color); border-radius: 50%; animation: spin 1s linear infinite;">
                </div>
                <h3 style="color: var(--text-primary); margin: 0;">Generating Art...</h3>
                <p id="ai-loading-msg"
                    style="color: var(--text-secondary); margin: 0; font-size: 0.9rem; text-align: center; max-width: 80%;">
                    Processing request. Please wait...</p>
                <div id="ai-progress-container" class="hidden"
                    style="width: 280px; height: 8px; background: rgba(255, 255, 255, 0.15); border-radius: 4px; overflow: hidden; margin-top: 5px; border: 1px solid rgba(255, 255, 255, 0.05);">
                    <div id="ai-progress-bar"
                        style="width: 0%; height: 100%; background: linear-gradient(90deg, #3b82f6, #60a5fa); transition: width 0.4s ease; border-radius: 4px;">
                    </div>
                </div>
            </div>

            <div class="editor-section hidden" id="editor-section">
                <div class="workspace">
                    <div class="canvas-container">
                        <img id="image-workspace" src="" alt="Workspace">
                    </div>
                    <div class="controls">
                        <div class="toolbar">
                            <button id="rotate-btn" class="icon-btn" title="Rotate 90 degrees">↻ Rotate 90
                                degrees</button>
                            <button id="reset-btn" class="icon-btn" title="Reset Settings">↺ Reset Settings</button>
                            <button id="restart-btn" class="icon-btn danger-btn" title="Upload New Image">✕ Upload New
                                Image</button>
                            <a id="ai-download-btn" class="icon-btn hidden" title="Download Original AI Image"
                                style="background: linear-gradient(135deg, #7c3aed, #4f46e5); color: white; text-decoration: none; display: none;">⬇
                                Download AI Image</a>
                        </div>
                        <div class="control-group">
                            <label for="ratio_select">Output Size</label>
                            <select id="ratio_select" name="ratio" class="styled-select">
                                <option value="800x480" selected>800 x 480 (Landscape)</option>
                                <option value="480x800">480 x 800 (Portrait)</option>
                                <option value="1600x1200">1600 x 1200 (Landscape)</option>
                                <option value="1200x1600">1200 x 1600 (Portrait)</option>
                            </select>
                        </div>

                        <div class="control-group">
                            <label for="dithering_algo_select">Dithering</label>
                            <select id="dithering_algo_select" name="dithering_algo" class="styled-select">
                                <option value="floyd" selected>Floyd-Steinberg</option>
                                <option value="stucki">Stucki</option>
                                <option value="atkinson">Atkinson</option>
                                <option value="yliluoma">Joel Yliluoma</option>
                                <option value="bluenoise">Blue Noise</option>
                            </select>
                        </div>

                        <div class="control-group">
                            <label for="saturation">Saturation: <span id="sat-val">0</span></label>
                            <input type="range" id="saturation" min="-100" max="100" value="0">
                        </div>

                        <div class="control-group">
                            <label for="contrast">Contrast: <span id="con-val">0</span></label>
                            <input type="range" id="contrast" min="-100" max="100" value="0">
                        </div>

                        <button id="process-btn" class="primary-btn">Apply 6-Color Dithering</button>
                    </div>
                </div>
            </div>

            <div class="result-section hidden" id="result-section">
                <h2>Preview</h2>
                <div class="result-preview">
                    <canvas id="result-canvas"></canvas>
                </div>
                <div class="actions">
                    <button id="back-btn" class="secondary-btn">Back to Edit</button>
                    <button id="upload-server-btn" class="primary-btn">Save</button>
                </div>
                <p id="upload-status"></p>
            </div>
        </main>
    </div>

    <!-- Cropper.js JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <!-- HEIC to JPEG converter -->
    <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
    <script src="assets/js/script.js?v=8"></script>
    <!-- footer -->
    <footer>
        <p>@2026 Eink AI Generator by Jackie | Version 2.0(Beta)</p>
    </footer>
</body>

</html>
